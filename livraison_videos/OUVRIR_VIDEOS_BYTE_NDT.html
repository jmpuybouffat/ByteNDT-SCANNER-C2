<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE NDT — Living Engineering</title><style>body{max-width:1600px;margin:24px auto;padding:0 24px;background:#fff;color:#092331;font:18px/1.5 system-ui}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #dce5e9;padding-bottom:12px}strong{font-size:26px}small{color:#546976}h1{font-size:30px}button,select{font:inherit;padding:8px 14px;margin:4px;border:1px solid #b6ccd2;border-radius:5px;background:#f1f7f8;color:#092331;cursor:pointer}button[aria-pressed=true]{background:#09a6b5;color:#fff}video{display:block;width:100%;max-height:76vh;margin:20px 0;background:#092331}nav{margin:18px 0}footer{border-top:2px solid #09a6b5;padding-top:12px}</style><header><strong>BYTE NDT</strong><small>THE DIGITAL TWIN / LIVING ENGINEERING</small></header><h1 id="title"></h1><div><button id="fr">Français</button><button id="en">English</button><label><span id="caseLabel"></span><select id="case"><option>C1</option><option>C2</option></select></label><button id="full"></button></div><p id="description"></p><label><input id="sound" type="checkbox"> <span id="soundLabel"></span></label><label> <span id="volumeLabel"></span> <input id="volume" type="range" min="0" max="1" step="0.05" value="0.3"></label><audio id="ambience" src="AMBIANCE_PREMIERE_VIDEO.m4a" preload="metadata"></audio><video id="video" controls preload="metadata" playsinline></video><nav id="chapters"></nav><p><a href="TEXTES_CONFERENCE_FR_EN.html" target="_blank">Textes de conférence / Speaker scripts</a> · <a id="questionnaireLink" href="FICHE_TEST_COMPREHENSION_FR_EN.html" target="_blank">Test de compréhension / Comprehension review</a></p><footer><p id="note"></p><small id="scope"></small></footer><script>
let lang='fr';const $=id=>document.getElementById(id),v=$('video'),a=$('ambience');a.volume=.3;

function update(){$('questionnaireLink').href='QUESTIONNAIRE_'+$('case').value+'_'+lang.toUpperCase()+'.html';a.pause();a.currentTime=0;$('soundLabel').textContent=lang==='fr'?'Bande sonore de la première vidéo (option)':'First video soundtrack (optional)';$('volumeLabel').textContent=lang==='fr'?'Volume':'Volume';document.documentElement.lang=lang;$('fr').setAttribute('aria-pressed',lang==='fr');$('en').setAttribute('aria-pressed',lang==='en');$('title').textContent=lang==='fr'?'Apprendre avec le jumeau de la racine':'Learning with the blade-root twin';$('caseLabel').textContent=lang==='fr'?'Examen : ':'Examination: ';$('full').textContent=lang==='fr'?'Plein écran':'Full screen';$('description').textContent=lang==='fr'?'Deux examens complémentaires, de la préparation à l’interprétation puis à l’évolution du cas.':'Two complementary examinations, from planning to interpretation and case evolution.';$('note').textContent=lang==='fr'?'Édition de revue 02 — commentaires à l’écran, sans voix. Utilisez les chapitres pour votre visioconférence.':'Review edition 02 — on-screen commentary, no voice-over. Use the chapters for your video conference.';$('scope').textContent=lang==='fr'?'Rejeu numérique de données sources. Le calcul de durée de vie et la génération de scénarios par IA restent des perspectives de développement.':'Digital replay of source data. Service-life assessment and AI scenario generation remain development perspectives.';v.src='BYTE_NDT_'+$('case').value+'_Living_Engineering_'+lang.toUpperCase()+'_REV02.mp4';$('chapters').replaceChildren(...chapters.map(c=>{const b=document.createElement('button');b.textContent=c[lang==='fr'?1:2];b.onclick=()=>{v.currentTime=c[0];v.play().catch(()=>{})};return b}));}
