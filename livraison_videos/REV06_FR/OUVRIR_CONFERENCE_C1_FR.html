const chapters=[{"t": 0, "fr": "Présentation de l’examen", "en": "Présentation de l’examen", "nfr": "Le jumeau relie la pièce, l’accès, le scanner et les résultats.", "nen": "Le jumeau relie la pièce, l’accès, le scanner et les résultats."}, {"t": 12, "fr": "Passage entre les aubes", "en": "Passage entre les aubes", "nfr": "Le scanner doit respecter les contraintes du passage entre deux aubes.", "nen": "Le scanner doit respecter les contraintes du passage entre deux aubes."}, {"t": 24, "fr": "Angles et effet de coin", "en": "Angles et effet de coin", "nfr": "45° est une direction dans le repère horizontal. La normale locale varie sur la surface courbe : l’angle relatif au plan tangent est différent. Le sabot nominal 55° et le secteur PA 35°–70° décrivent la configuration. Il ne faut pas confondre ces repères.", "nen": "45° est une direction dans le repère horizontal. La normale locale varie sur la surface courbe : l’angle relatif au plan tangent est différent. Le sabot nominal 55° et le secteur PA 35°–70° décrivent la configuration. Il ne faut pas confondre ces repères."}, {"t": 39, "fr": "Référence 3 mm", "en": "Référence 3 mm", "nfr": "Référence EDM de 3 mm = 50 % de hauteur d’écran dans la convention de cartographie. Les autres indications ne mesurent pas nécessairement 3 mm.", "nen": "Référence EDM de 3 mm = 50 % de hauteur d’écran dans la convention de cartographie. Les autres indications ne mesurent pas nécessairement 3 mm."}, {"t": 49, "fr": "Scanner assemblé et éclaté", "en": "Scanner assemblé et éclaté", "nfr": "L’éclaté explique l’assemblage à l’arrêt. Le scanner est réassemblé pour le parcours.", "nen": "L’éclaté explique l’assemblage à l’arrêt. Le scanner est réassemblé pour le parcours."}, {"t": 65, "fr": "Scan continu", "en": "Scan continu", "nfr": "La sonde se déplace et les données sources construisent la carte et le nuage UT. Cette séquence est déjà accélérée ×3 dans le MP4. Une vitesse de lecteur ×2 la montrera donc à ×6 par rapport à l’enregistrement source. « Rejeu » signifie déroulé des données numériques existantes, pas une nouvelle acquisition physique.", "nen": "La sonde se déplace et les données sources construisent la carte et le nuage UT. Cette séquence est déjà accélérée ×3 dans le MP4. Une vitesse de lecteur ×2 la montrera donc à ×6 par rapport à l’enregistrement source. « Rejeu » signifie déroulé des données numériques existantes, pas une nouvelle acquisition physique."}, {"t": 161.303, "fr": "Carte complète", "en": "Carte complète", "nfr": "Lire la réponse avec sa position, sa référence et ses réglages.", "nen": "Lire la réponse avec sa position, sa référence et ses réglages."}, {"t": 169.303, "fr": "Indications retenues", "en": "Indications retenues", "nfr": "Cinq références EDM sont mises en correspondance. La validation numérique ne démontre pas à elle seule l’absence de faux positifs.", "nen": "Cinq références EDM sont mises en correspondance. La validation numérique ne démontre pas à elle seule l’absence de faux positifs."}, {"t": 176.553, "fr": "Comprendre la TFM", "en": "Comprendre la TFM", "nfr": "TFM signifie méthode de focalisation totale. Les signaux émetteur-récepteur sont alignés selon leurs temps de trajet puis sommés pour chaque point de l’image. La couleur indique un niveau relatif en dB. U et V sont les coordonnées locales ; les contours −6 et −12 dB délimitent des niveaux de réponse, pas nécessairement les bords physiques du défaut.", "nen": ""}, {"t": 211.553, "fr": "TFM — EDM_01", "en": "TFM — EDM_01", "nfr": "La TFM focalise les contributions émetteur-récepteur. Comparer localisation, forme et amplitude dans les mêmes axes et avec les mêmes réglages. L’image ne donne pas directement la taille exacte de la fissure.", "nen": "La TFM focalise les contributions émetteur-récepteur. Comparer localisation, forme et amplitude dans les mêmes axes et avec les mêmes réglages. L’image ne donne pas directement la taille exacte de la fissure."}, {"t": 219.553, "fr": "TFM — EDM_02", "en": " "Comprendre les voxels", "nfr": "Un voxel est une cellule de la grille 3D portant une valeur de réponse reconstruite. Les points montrent les cellules affichées au seuil −6 dB, et non une collection de défauts. Les projections U–V, U–W et V–W sont trois vues du même volume. Elles servent à localiser et comparer la réponse ; le seuil modifie son étendue visible.", "nen": ""}, {"t": 286.553, "fr": "Voxels — EDM_01", "en": "Voxels — EDM_01", "nfr": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la grille volumique retenues au seuil affiché ; ils ne représentent pas chacun un défaut. Pour comparer deux états, conserver repères et seuils.", "nen": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la grille volumique retenues au seuil affiché ; ils ne représentent pas chacun un défaut. Pour comparer deux états, conserver repères et seuils."}, {"t": 293.553, "fr": "Voxels — EDM_02", "en": "Voxels — EDM_02", "nfr": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la grille volumique retenues au seuil affiché ; ils ne représentent pas chacun un défaut. Pour comparer deux états, conserver repères et seuils.", "nen": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la grille volumique retenues au seuil affiché ; ils ne représentent pas chacun un défaut. Pour comparer deux états, conserver repères et seuils."}, {"t": 300.553, "fr": "Voxels — EDM_03", "en": "Voxels — EDM_03", "nfr": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la grille volumique retenues au seuil affiché ; ils ne représentent pas chacun un défaut. Pour comparer deux états, conserver repères et seuils.", "nen": "Les trois projections montrent la même réponse selon trois plans. Les petits points sont les positions de la gri e learning, TFM et voxels sont des représentations à associer à des indications connues, aux conditions et aux réglages. Modifier une image ne démontre pas une croissance réelle.", "nen": "Le processus jumeau permet d’étudier plusieurs configurations avant l’investissement dans l’équipement UT et de préparer positions, orientations, parcours et lois. Les exports préparent le transfert ; l’import dépend du format accepté par l’instrument et de sa validation. Pour le machine learning, TFM et voxels sont des représentations à associer à des indications connues, aux conditions et aux réglages. Modifier une image ne démontre pas une croissance réelle."}];const v=document.getElementById('video'),$=id=>document.getElementById(id);let lang='fr',active=0,boundary=null,url=null;
const ui={fr:{brand:'JUMEAU — L’INGÉNIERIE VIVANTE',title:'Déroulé de l’examen C1 — lecteur de conférence',modeLabel:'Mode',rateLabel:'Vitesse du lecteur',auto:'Lecture continue',manual:'Conférence : pause à chaque étape',prev:'← Étape précédente',play:'Lecture / pause',next:'Étape suivante →',full:'Plein écran',notice:'Pack C1 français REV06 : film, commandes et explications en français. La version anglaise sera fournie séparément. Le scan est déjà accéléré ×3. Espace : lecture/pause ; flèches gauche/droite : étapes. Les réglages ne modifient pas le MP4.',fileLabel:'Si nécessaire, sélectionner votre MP4 local :',error:'Vidéo introuvable : placer le MP4 dans le même dossier que ce lecteur, ou le sélectionner ci-dessus.'},en:{brand:'TWIN — LIVING ENGINEERING',title:'C1 examination sequence — conference player',modeLabel:'Mode',rateLabel:'Player speed',auto:'Continuous playback',manual:'Conference: pause at each stage',prev:'← Previous stage',play:'Play / pause',next:'Next stage →',full:'Fullscreen',notice:'French C1 REV05 film. Interface and notes are FR/EN; they do not translate the film images. The scan is already accelerated ×3. Space: play/pause; left/right arrows: stages. Controls do not modify the MP4.',fileLabel:'If needed, select your local MP4:',error:'Video not found: place the MP4 beside this player or select it above.'}};
function render(){const u=ui[lang];document.documentElement.lang=lang;for(const id of ['brand','title','modeLabel','rateLabel','prev','play','next','full','notice','fileLabel'])$(id).textContent=u[id];$('mode').options[0].textContent=u.auto;$('mode').options[1].textContent=u.manual;$('list').replaceChildren();chapters.forEach((c,i)=>{let b=document.createElement('button');b.textContent=fmt(c.t)+' · '+c[lang];b.classList.toggle('active',i===active);b.onclick=()=>go(i);$('list').append(b)});$('notes').textContent=chapters[active][lang==='fr'?'nfr':'nen'];$('state').textContent=(active+1)+' / '+chapters.length+' · '+chapters[active][lang];$('fr').classList.toggle('active',lang==='fr');$('en').classList.toggle('active',lang==='en')}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function arm(){boundary=$('mode').value==='manual'?(chapters[active+1]?.t??v.duration):null}
function go(i){v.pause();active=Math.max(0,Math.min(chapters.length-1,i));v.currentTime=chapters[active].t;arm();render()}
$('fr').onclick=()=>{lang='fr';render()};$('prev').onclick=()=>go(active-1);$('next').onclick=()=>go(active+1);$('play').onclick=()=>v.paused?v.play().catch(()=>{}):v.pause();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else v.requestFullscreen?.()};$('mode').onchange=()=>{v.pause();arm()};$('rate').onchange=()=>v.playbackRate=Number($('rate').value);
v.addEventListener('play',arm);v.addEventListener('timeupdate',()=>{if(boundary!==null&&!v.paused&&v.currentTime>=boundary){v.pause();v.currentTime=Math.max(chapters[active].t,boundary-.04);boundary=null;return}let i=chapters.findLastIndex(c=>v.currentTime>=c.t-.01);if(i>=0&&i!==active){active=i;render()}});v.addEventListener('error',()=>$('error').textContent=ui[lang].error);v.addEventListener('loadedmetadata',()=>$('error').textContent='');$('file').onchange=()=>{if(!$('file').files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL($('file').files[0]);v.src=url;active=0;render()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowRight'){e.preventDefault();go(active+1)}if(e.code==='ArrowLeft'){e.preventDefault();go(active-1)}});render();
