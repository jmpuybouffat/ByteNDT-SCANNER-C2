<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BYTE NDT — Conférence C1</title><style>body{margin:0;background:#eef3f5;color:#102735;font:17px system-ui}header{background:#102735;color:white;padding:16px 24px;display:flex;justify-content:space-between}main{max-width:1500px;margin:auto;padding:18px}video{width:100%;max-height:72vh;background:#07141d}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:12px 0}button,select{font:inherit;padding:9px;border:1px solid #9aafb8;border-radius:5px;background:white;color:#102735;cursor:pointer}button:focus-visible{outline:3px solid #009fac}button.active{background:#007e91;color:white}#notes{background:white;border-left:5px solid #009fac;padding:18px;line-height:1.55}#list{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#list button{font-size:14px}small{display:block;margin:12px 0}input[type=file]{max-width:300px}@media print{video,.bar,#list{display:none}}</style><header><b>BYTE NDT</b><span id="brand"></span></header><main><h1 id="title"></h1><div class="bar"><button id="fr">Français</button><button id="en">English</button><label id="modeLabel" for="mode"></label><select id="mode"><option value="auto"></option><option value="manual"></option></select><label id="rateLabel" for="rate"></label><select id="rate"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></div><video id="video" controls preload="metadata" playsinline src="C1_DEROULE_EXAMEN_FR_REV05.mp4"></video><div class="bar"><button id="prev"></button><button id="play"></button><button id="next"></button><button id="full"></button><span id="state" role="status" aria-live="polite"></span></div><div id="list"></div><article id="notes"></article><small id="notice"></small><label id="fileLabel" for="file"></label> <input id="file" type="file" accept="video/mp4"><p id="error" role="alert"></p></main><script>
const chapters=__CHAPTERS_JSON__;const v=document.getElementById('video'),$=id=>document.getElementById(id);let lang='fr',active=0,boundary=null,url=null;
const ui={fr:{brand:'JUMEAU — L’INGÉNIERIE VIVANTE',title:'Déroulé de l’examen C1 — lecteur de conférence',modeLabel:'Mode',rateLabel:'Vitesse du lecteur',auto:'Lecture continue',manual:'Conférence : pause à chaque étape',prev:'← Étape précédente',play:'Lecture / pause',next:'Étape suivante →',full:'Plein écran',notice:'Film C1 français REV05. L’interface et les notes sont FR/EN ; elles ne traduisent pas les images du film. Le scan est déjà accéléré ×3. Espace : lecture/pause ; flèches gauche/droite : étapes. Les réglages ne modifient pas le MP4.',fileLabel:'Si nécessaire, sélectionner votre MP4 local :',error:'Vidéo introuvable : placer le MP4 dans le même dossier que ce lecteur, ou le sélectionner ci-dessus.'},en:{brand:'TWIN — LIVING ENGINEERING',title:'C1 examination sequence — conference player',modeLabel:'Mode',rateLabel:'Player speed',auto:'Continuous playback',manual:'Conference: pause at each stage',prev:'← Previous stage',play:'Play / pause',next:'Next stage →',full:'Fullscreen',notice:'French C1 REV05 film. Interface and notes are FR/EN; they do not translate the film images. The scan is already accelerated ×3. Space: play/pause; left/right arrows: stages. Controls do not modify the MP4.',fileLabel:'If needed, select your local MP4:',error:'Video not found: place the MP4 beside this player or select it above.'}};
function render(){const u=ui[lang];document.documentElement.lang=lang;for(const id of ['brand','title','modeLabel','rateLabel','prev','play','next','full','notice','fileLabel'])$(id).textContent=u[id];$('mode').options[0].textContent=u.auto;$('mode').options[1].textContent=u.manual;$('list').replaceChildren();chapters.forEach((c,i)=>{let b=document.createElement('button');b.textContent=fmt(c.t)+' · '+c[lang];b.classList.toggle('active',i===active);b.onclick=()=>go(i);$('list').append(b)});$('notes').textContent=chapters[active][lang==='fr'?'nfr':'nen'];$('state').textContent=(active+1)+' / '+chapters.length+' · '+chapters[active][lang];$('fr').classList.toggle('active',lang==='fr');$('en').classList.toggle('active',lang==='en')}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function arm(){boundary=$('mode').value==='manual'?(chapters[active+1]?.t??v.duration):null}
function go(i){v.pause();active=Math.max(0,Math.min(chapters.length-1,i));v.currentTime=chapters[active].t;arm();render()}
$('fr').onclick=()=>{lang='fr';render()};$('en').onclick=()=>{lang='en';render()};$('prev').onclick=()=>go(active-1);$('next').onclick=()=>go(active+1);$('play').onclick=()=>v.paused?v.play().catch(()=>{}):v.pause();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else v.requestFullscreen?.()};$('mode').onchange=()=>{v.pause();arm()};$('rate').onchange=()=>v.playbackRate=Number($('rate').value);
v.addEventListener('play',arm);v.addEventListener('timeupdate',()=>{if(boundary!==null&&!v.paused&&v.currentTime>=boundary){v.pause();v.currentTime=Math.max(chapters[active].t,boundary-.04);boundary=null;return}let i=chapters.findLastIndex(c=>v.currentTime>=c.t-.01);if(i>=0&&i!==active){active=i;render()}});v.addEventListener('error',()=>$('error').textContent=ui[lang].error);v.addEventListener('loadedmetadata',()=>$('error').textContent='');$('file').onchange=()=>{if(!$('file').files[0])return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL($('file').files[0]);v.src=url;active=0;render()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowRight'){e.preventDefault();go(active+1)}if(e.code==='ArrowLeft'){e.preventDefault();go(active-1)}});render();
</script></html>
